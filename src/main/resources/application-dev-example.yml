# Configuración de EJEMPLO para DESARROLLO LOCAL
# Copiar este archivo como application-dev.yml y configurar con valores reales
# application-dev.yml NO debe subirse a Git (está en .gitignore)

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://[TU_HOST].supabase.com:5432/postgres
    username: postgres.[TU_PROYECTO]
    password: [TU_PASSWORD]
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

logging:
  level:
    com.puntored.transactions_api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate: INFO
  environment: dev

# CORS para desarrollo (localhost)
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# Configuración de la API de Puntored (DESARROLLO)
puntored:
  api:
    base-url: https://us-central1-puntored-dev.cloudfunctions.net/technicalTest-developer/api
    api-key: [TU_API_KEY]
    auth:
      user: [TU_USUARIO]
      password: [TU_PASSWORD]
    timeouts:
      default-timeout: 10
      buy-timeout: 30

# Configuración de Supabase JWT (DESARROLLO)
supabase:
  jwt-secret: [TU_JWT_SECRET]
  jwt-issuer: https://[TU_PROYECTO].supabase.co/auth/v1

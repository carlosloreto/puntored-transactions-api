# Configuración BASE (común para todos los perfiles)
# Las credenciales específicas están en application-dev.yml y application-prod.yml

server:
  port: ${PORT:8080}  # Puerto por defecto, Cloud Run proporciona PORT automáticamente

spring:
  application:
    name: puntored-transactions-api
  
  # Perfil activo por defecto (cambiar a 'prod' en producción)
  # En Cloud Run, usar: SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Configuración de Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Configuración de timeouts para API de Puntored (valores por defecto)
puntored:
  api:
    timeouts:
      default-timeout: 10  # Timeout para auth y getSuppliers (segundos)
      buy-timeout: 30      # Timeout para operaciones de compra (segundos)
